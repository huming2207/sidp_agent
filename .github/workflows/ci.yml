name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -Dwarnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust with checks
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo doc --locked --no-deps

  e2e:
    name: GDB to C++ SIDP session
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout compatible firmware protocol fixture
        uses: actions/checkout@v4
        with:
          repository: huming2207/sidp_client
          ref: efed1a14d565f3069ae1a17cade8e97f8d8eb6b4
          path: sidp-client-fixture
      - name: Check job schema copy matches sidp_client
        run: |
          diff proto/job.proto sidp-client-fixture/proto/job.proto
          diff proto/job.options sidp-client-fixture/proto/job.options
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ gdb-multiarch python3
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run real GDB over fragmented serial PTY
        run: >-
          python3 tests/e2e/run.py
          --sidp-client sidp-client-fixture
          --gdb /usr/bin/gdb-multiarch
          --output /tmp/sidp-e2e
      - name: Keep test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidp-e2e-logs
          path: |
            /tmp/sidp-e2e/*.log
            /tmp/sidp-e2e/*.gdb
          if-no-files-found: ignore
