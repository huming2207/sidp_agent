[package]
name = "sidp-desktop"
version = "0.1.0"
edition = "2024"
description = "Desktop app for setting up Soul Injector debugging and programming"
publish = false
license-file = "../LICENSE.md"

[dependencies]
sidp-agent = { path = ".." }
gpui-kit = "0.9.1"
anyhow = "1"
futures = "0.3"
gdbstub = "0.7.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.10", default-features = false }
yaml_serde = "0.10"

[dev-dependencies]
tempfile = "3"
gpui-kit = { version = "0.9.1", features = ["test-support"] }

[lints.rust]
unsafe_code = "forbid"

# A workspace of its own: the desktop app's dependencies (gpui pins some
# crates) never change the versions sidp-agent's CLI is locked to.
[workspace]
