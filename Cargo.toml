[package]
name = "sidp-agent"
version = "0.1.0"
edition = "2024"
description = "USB SIDP to local GDB bridge for Soul Injector"
publish = false
license-file = "LICENSE.md"

[dependencies]
gdbstub = "0.7.10"
serialport = { version = "4.10", default-features = false }
clap = { version = "4.6", features = ["derive"] }
thiserror = "2"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
